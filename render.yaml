# Optional: the same image also runs on Render's free tier.
# On a VPS use compose.yaml instead.
services:
  - type: web
    name: shoetryon
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    disk:
      name: storage
      mountPath: /app/storage
      sizeGB: 1
    envVars:
      # Render terminates TLS itself and routes to this port.
      - key: SERVER_NAME
        value: ":10000"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_LEVEL
        value: warning
